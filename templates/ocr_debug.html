<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR 프레임 디버깅</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .status-panel {
            background: #1a1f2e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #2a3441;
        }
        
        .frame-display {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .frame-container {
            background: #1a1f2e;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #2a3441;
        }
        
        .frame-container h3 {
            margin-top: 0;
            color: #64b5f6;
        }
        
        .frame-image {
            width: 100%;
            max-width: 500px;
            border-radius: 8px;
            background: #000;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
        }
        
        .ocr-results {
            background: #1a1f2e;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #2a3441;
            margin-bottom: 20px;
        }
        
        .detected-text {
            background: #2a3441;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .codes-found {
            margin-top: 15px;
        }
        
        .code-item {
            background: #4caf50;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            display: inline-block;
            margin: 5px;
            font-weight: bold;
        }
        
        .target-code {
            background: #ff5722;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        
        .controls {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .btn {
            background: #2196f3;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            margin: 0 10px;
            font-size: 16px;
        }
        
        .btn:hover {
            background: #1976d2;
        }
        
        .btn.danger {
            background: #f44336;
        }
        
        .btn.danger:hover {
            background: #d32f2f;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-item {
            background: #1a1f2e;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #2a3441;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #64b5f6;
        }
        
        .stat-label {
            color: #aaa;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔍 OCR 프레임 실시간 디버깅</h1>
        <p>YouTube 영상에서 리딤 코드를 추출하는 과정을 실시간으로 확인할 수 있습니다</p>
    </div>
    
    <div class="controls">
        <button class="btn" onclick="startMonitoring()">모니터링 시작</button>
        <button class="btn danger" onclick="stopMonitoring()">모니터링 중지</button>
        <button class="btn" onclick="refreshFrame()">프레임 새로고침</button>
    </div>
    
    <div class="stats">
        <div class="stat-item">
            <div class="stat-value" id="frames-processed">0</div>
            <div class="stat-label">처리된 프레임</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="codes-found">0</div>
            <div class="stat-label">발견된 코드</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="runtime">0s</div>
            <div class="stat-label">실행 시간</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="status">중지</div>
            <div class="stat-label">상태</div>
        </div>
    </div>
    
    <div class="frame-display">
        <div class="frame-container">
            <h3>원본 프레임</h3>
            <div class="frame-image" id="original-frame">
                프레임 로딩 중...
            </div>
        </div>
        <div class="frame-container">
            <h3>전처리된 프레임</h3>
            <div class="frame-image" id="processed-frame">
                전처리 결과 대기 중...
            </div>
        </div>
    </div>
    
    <div class="ocr-results">
        <h3>OCR 추출 결과</h3>
        <div class="detected-text" id="detected-text">
OCR 결과가 여기에 표시됩니다...
        </div>
        <div class="codes-found">
            <h4>발견된 코드:</h4>
            <div id="codes-list">
                아직 발견된 코드가 없습니다.
            </div>
        </div>
    </div>

    <script>
        let debugInterval;
        
        function startMonitoring() {
            const url = prompt('YouTube URL을 입력하세요:', 'https://www.youtube.com/watch?v=oNnLByYSzHw');
            if (!url) return;
            
            fetch('/api/ocr/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({url: url})
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('모니터링이 시작되었습니다!');
                    startDebugUpdates();
                } else {
                    alert('모니터링 시작 실패: ' + data.message);
                }
            });
        }
        
        function stopMonitoring() {
            fetch('/api/ocr/stop', {method: 'POST'})
            .then(response => response.json())
            .then(data => {
                alert('모니터링이 중지되었습니다.');
                stopDebugUpdates();
            });
        }
        
        function startDebugUpdates() {
            debugInterval = setInterval(updateDebugInfo, 2000);
        }
        
        function stopDebugUpdates() {
            if (debugInterval) {
                clearInterval(debugInterval);
                debugInterval = null;
            }
        }
        
        function updateDebugInfo() {
            fetch('/api/ocr/debug')
            .then(response => response.json())
            .then(data => {
                // 통계 업데이트
                document.getElementById('frames-processed').textContent = data.frames_processed || 0;
                document.getElementById('codes-found').textContent = data.total_codes || 0;
                document.getElementById('runtime').textContent = (data.runtime_seconds || 0) + 's';
                document.getElementById('status').textContent = data.status || '중지';
                
                // 프레임 이미지 업데이트
                if (data.original_frame) {
                    document.getElementById('original-frame').innerHTML = 
                        '<img src="data:image/jpeg;base64,' + data.original_frame + '" style="max-width:100%; border-radius:8px;">';
                }
                
                if (data.processed_frame) {
                    document.getElementById('processed-frame').innerHTML = 
                        '<img src="data:image/jpeg;base64,' + data.processed_frame + '" style="max-width:100%; border-radius:8px;">';
                }
                
                // OCR 결과 업데이트
                if (data.detected_text) {
                    document.getElementById('detected-text').textContent = data.detected_text;
                }
                
                // 발견된 코드 업데이트
                if (data.codes_found && data.codes_found.length > 0) {
                    const codesHtml = data.codes_found.map(code => {
                        const isTarget = ['MasterSkirk0618', 'YourSpaceTime', 'VoidStar0618'].includes(code);
                        return '<span class="code-item' + (isTarget ? ' target-code' : '') + '">' + code + '</span>';
                    }).join('');
                    document.getElementById('codes-list').innerHTML = codesHtml;
                } else {
                    document.getElementById('codes-list').textContent = '아직 발견된 코드가 없습니다.';
                }
            })
            .catch(error => {
                console.error('디버그 정보 업데이트 실패:', error);
            });
        }
        
        function refreshFrame() {
            updateDebugInfo();
        }
        
        // 페이지 로드시 자동으로 상태 확인
        window.onload = function() {
            updateDebugInfo();
        };
    </script>
</body>
</html>
